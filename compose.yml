services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=BRbU8kXra2qW6_rA
      - MINIO_ROOT_PASSWORD=uOvPSFqIpH7RD54AyeAB-APJO9CwRDlp
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
  postgres:
    build: .
    command: debug busy
    environment:
      - POSTGRES_USER=EMHEDUKiXhksaoYo
      - POSTGRES_PASSWORD=mDQf6JnxNxRRktv4nZ5XRyjFekSQg07gOVehEukxuVT6VYL3_AOxL2URBb7PdDVb
      - POSTGRES_DB=Z5WJMOCY4HjoDsrI
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=test-bucket
      - S3_ACCESS_KEY_ID=BRbU8kXra2qW6_rA
      - S3_SECRET_ACCESS_KEY=uOvPSFqIpH7RD54AyeAB-APJO9CwRDlp
      - PG_LOG_LEVEL=debug
    ports:
      - 3456:3456
      - 5433:5432
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./.state:/var/lib/pg
    depends_on:
      - minio

volumes:
  minio-data:
  pg-data:
